databaseChangeLog:
  - changeSet:
      id: create-countries-table
      author: wojtek-a
      changes:
        - createTable:
            tableName: countries
            columns:
              - column:
                  name: code
                  type: varchar(20)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
