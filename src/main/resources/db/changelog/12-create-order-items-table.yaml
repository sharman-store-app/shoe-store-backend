databaseChangeLog:
  - changeSet:
      id: create-order-items-table
      author: wojtek-a
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: variant_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: price_at_order
                  type: decimal(10,2)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_orders_order_items
        - addForeignKeyConstraint:
            baseTableName: order_items
            baseColumnNames: variant_id
            referencedTableName: product_variants
            referencedColumnNames: id
            constraintName: fk_product_variants_order_items
