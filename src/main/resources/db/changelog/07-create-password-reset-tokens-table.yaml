databaseChangeLog:
  - changeSet:
      id: create-password-reset-tokens-table
      author: wojtek-a
      changes:
        - createTable:
            tableName: password_reset_tokens
            author: wojtek-a
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - addForeignKeyConstraint:
                  baseTableName: password_reset_tokens
                  baseColumnNames: user_id
                  referencedTableName: users_table
                  referencedColumnNames: id
                  constraintName: fk_password_reset_tokens_user




